<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4 In A Row</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      padding: 20px;
    }

    :root {
      --cell: min(70px, calc((100vw - 80px) / 7));
      --gap: max(4px, calc(var(--cell) * 0.11));
    }

    h1 {
      font-size: clamp(1.4rem, 6vw, 2.5rem);
      margin-bottom: 20px; letter-spacing: 2px; text-transform: uppercase;
      text-align: center; padding: 0 12px;
    }

    #turn-indicator {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 12px; font-size: clamp(0.85rem, 3vw, 1rem);
    }
    .disc-preview { width: 24px; height: 24px; border-radius: 50%; }

    #status {
      font-size: clamp(1rem, 4vw, 1.3rem); margin-bottom: 20px;
      height: 2rem; font-weight: bold; text-align: center;
    }
    .player-red    { color: #ff0000; }
    .player-yellow { color: #ffff00; }
    .player-blue   { color: #3498db; }
    .draw          { color: #aaa; }

    #board-wrapper {
      background: #2471a3; border-radius: 16px;
      padding: max(8px, calc(var(--cell) * 0.2));
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    #board {
      position: relative;
      display: grid;
      grid-template-columns: repeat(7, var(--cell));
      grid-template-rows: repeat(6, var(--cell));
      gap: var(--gap);
    }

    .falling-disc {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
    }
    .falling-disc.red    { background: #ff0000; }
    .falling-disc.yellow { background: #ffff00; }
    .falling-disc.blue   { background: #3498db; }

    .cell {
      width: var(--cell); height: var(--cell); border-radius: 50%;
      background: #1a1a2e; cursor: pointer;
      transition: background 0.12s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .cell.red    { background: #ff0000 !important; cursor: default; }
    .cell.yellow { background: #ffff00 !important; cursor: default; }
    .cell.blue   { background: #3498db !important; cursor: default; }
    .cell.win    { animation: pulse 0.6s infinite alternate; }

    @media (hover: none) {
      .cell:not(.red):not(.yellow) { background: #1a1a2e !important; }
    }

    @keyframes pulse {
      from { filter: brightness(1); }
      to   { filter: brightness(1.6); }
    }

    .btn-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }

    button {
      padding: 12px 36px;
      font-size: 1rem; font-weight: bold; letter-spacing: 1px;
      background: #2471a3; color: white; border: none;
      border-radius: 8px; cursor: pointer; transition: background 0.2s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { background: #1a5276; }
    button.secondary { background: #444; }
    button.secondary:hover { background: #2e2e2e; }

    .size-btn { background: #333; opacity: 0.7; }
    .size-btn.selected { background: #2471a3; opacity: 1; box-shadow: 0 0 0 2px white inset; }

    #reset-btn { margin-top: 24px; }

    .panel {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      background: #22223a; border-radius: 16px; padding: 32px 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      max-width: 90vw;
    }

    .panel p.hint { color: #aaa; font-size: 0.95rem; text-align: center; }

    .tagline {
      color: #6ab0de; font-size: 0.85rem; font-weight: 600;
      text-align: center; letter-spacing: 0.3px;
    }

    .new-badge {
      background: #ff6b35; color: white; font-size: 0.6rem; font-weight: 800;
      padding: 2px 6px; border-radius: 10px; margin-left: 4px;
      letter-spacing: 0.5px; vertical-align: middle; white-space: nowrap;
    }

    #join-row { display: flex; gap: 8px; }
    #join-code-input {
      font-size: 1.2rem; letter-spacing: 4px; text-transform: uppercase;
      width: 7ch; text-align: center; padding: 10px; border-radius: 8px;
      border: none; background: #1a1a2e; color: white;
    }

    #room-code-display {
      font-size: 2.4rem; font-weight: bold; letter-spacing: 6px;
      background: #1a1a2e; padding: 12px 24px; border-radius: 8px;
    }

    .hidden { display: none !important; }

    #online-error { color: #ff6b6b; min-height: 1.2rem; font-size: 0.95rem; }

    #mute-btn {
      position: fixed; top: 16px; right: 16px;
      width: 44px; height: 44px; padding: 0;
      border-radius: 50%; background: #22223a; border: none;
      color: white; font-size: 1.3rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 50; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #mute-btn:hover { background: #2e2e4a; }

    .confetti-container {
      position: fixed; inset: 0; pointer-events: none; z-index: 1000; overflow: hidden;
    }
    .confetti-piece {
      position: absolute; top: -12px; width: 8px; height: 14px; opacity: 0.9;
      animation-name: confetti-fall; animation-timing-function: ease-in; animation-fill-mode: forwards;
    }
    @keyframes confetti-fall {
      to { transform: translateY(110vh) rotate(540deg); opacity: 0.3; }
    }
  </style>
</head>
<body>

  <button id="mute-btn" aria-label="Toggle sound">🔊</button>

  <h1>4 In A Row</h1>

  <!-- Main menu -->
  <div id="menu-screen" class="panel">
    <p class="tagline">2 or 3 players · vs computer or online</p>
    <p class="hint">Choose how you'd like to play</p>
    <div class="btn-row">
      <button id="play-ai-btn">Play vs Computer</button>
      <button id="play-online-btn">Play Online</button>
    </div>
  </div>

  <!-- vs-Computer sub-menu: choose 2 or 3 players -->
  <div id="ai-menu-screen" class="panel hidden">
    <p class="hint">How many players?</p>
    <div class="btn-row">
      <button id="ai-2p-btn">2 Player (vs Computer)</button>
      <button id="ai-3p-btn">3 Player (vs 2 Computers) <span class="new-badge">NEW</span></button>
    </div>
    <button class="secondary" id="ai-menu-back-btn">Back</button>
  </div>

  <!-- Online sub-menu: create or join a room -->
  <div id="online-menu-screen" class="panel hidden">
    <p class="hint">Room size</p>
    <div class="btn-row">
      <button class="size-btn selected" id="online-2p-btn" data-players="2">2 Players</button>
      <button class="size-btn" id="online-3p-btn" data-players="3">3 Players <span class="new-badge">NEW</span></button>
    </div>
    <div class="btn-row">
      <button id="create-room-btn">Create Room</button>
    </div>
    <p class="hint">— or —</p>
    <div id="join-row">
      <input id="join-code-input" maxlength="4" placeholder="CODE">
      <button id="join-room-btn">Join</button>
    </div>
    <div id="online-error"></div>
    <button class="secondary" id="online-back-btn">Back</button>
  </div>

  <!-- Waiting for other players to join -->
  <div id="waiting-screen" class="panel hidden">
    <p class="hint">Share this code with your opponents</p>
    <div id="room-code-display"></div>
    <p class="hint" id="waiting-text">Waiting for opponent to join...</p>
    <button class="secondary" id="waiting-back-btn">Cancel</button>
  </div>

  <!-- Game screen -->
  <div id="game-screen" class="hidden">
    <div id="turn-indicator">
      <div class="disc-preview" id="disc-preview"></div>
      <span id="turn-text">Your turn</span>
    </div>

    <div id="status"></div>

    <div id="board-wrapper">
      <div id="board"></div>
    </div>

    <div class="btn-row">
      <button id="reset-btn">New Game</button>
      <button class="secondary" id="leave-btn">Back to Menu</button>
    </div>
  </div>

  <script>
    const ROWS = 6, COLS = 7;
    const COLOR_HEX = { red: '#ff0000', yellow: '#ffff00', blue: '#3498db' };
    const menuScreen       = document.getElementById('menu-screen');
    const aiMenuScreen     = document.getElementById('ai-menu-screen');
    const onlineMenuScreen = document.getElementById('online-menu-screen');
    const waitingScreen    = document.getElementById('waiting-screen');
    const gameScreen       = document.getElementById('game-screen');

    const boardEl    = document.getElementById('board');
    const statusEl   = document.getElementById('status');
    const turnText   = document.getElementById('turn-text');
    const discPrev   = document.getElementById('disc-preview');
    const resetBtn   = document.getElementById('reset-btn');
    const leaveBtn   = document.getElementById('leave-btn');

    const playAiBtn      = document.getElementById('play-ai-btn');
    const aiMenuBackBtn  = document.getElementById('ai-menu-back-btn');
    const ai2pBtn        = document.getElementById('ai-2p-btn');
    const ai3pBtn        = document.getElementById('ai-3p-btn');
    const playOnlineBtn  = document.getElementById('play-online-btn');
    const onlineBackBtn  = document.getElementById('online-back-btn');
    const online2pBtn    = document.getElementById('online-2p-btn');
    const online3pBtn    = document.getElementById('online-3p-btn');
    const createRoomBtn  = document.getElementById('create-room-btn');
    const joinRoomBtn    = document.getElementById('join-room-btn');
    const joinCodeInput  = document.getElementById('join-code-input');
    const onlineErrorEl  = document.getElementById('online-error');
    const roomCodeDisplay = document.getElementById('room-code-display');
    const waitingText    = document.getElementById('waiting-text');
    const waitingBackBtn = document.getElementById('waiting-back-btn');
    const muteBtn         = document.getElementById('mute-btn');

    const STORAGE_KEY = 'connect4OnlineRoom';
    const SOUND_KEY = 'connect4SoundEnabled';

    let busy = false;        // prevent clicks while waiting for server
    let mode = null;         // 'ai' | 'online'
    let online = null;       // { roomId, playerToken, color }
    let onlinePlayers = 2;   // room size chosen in the online sub-menu
    let myColor = 'red';     // this client's own color (always red in vs-computer mode)
    let pollTimer = null;
    let previousBoard = null; // last-rendered board, used to detect newly-dropped discs
    let animating = false;    // guards against overlapping drop animations

    // ── Sound, haptics, confetti ─────────────────────────────────────
    let soundEnabled = localStorage.getItem(SOUND_KEY) !== 'false';
    let audioCtx = null;

    function updateMuteBtn() { muteBtn.textContent = soundEnabled ? '🔊' : '🔇'; }
    updateMuteBtn();
    muteBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      localStorage.setItem(SOUND_KEY, soundEnabled);
      updateMuteBtn();
    });

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTone({ freq, start = 0, duration, type = 'sine', peak = 0.22, endFreq }) {
      const ctx = getAudioCtx();
      const t = ctx.currentTime + start;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t + duration);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(peak, t + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + duration + 0.02);
    }

    function playDropSound() {
      if (!soundEnabled) return;
      playTone({ freq: 220, endFreq: 90, duration: 0.14, type: 'sine', peak: 0.25 });
    }
    function playWinSound() {
      if (!soundEnabled) return;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) =>
        playTone({ freq, start: i * 0.09, duration: 0.4, type: 'triangle', peak: 0.2 }));
    }
    function playLoseSound() {
      if (!soundEnabled) return;
      playTone({ freq: 300, endFreq: 140, duration: 0.45, type: 'sawtooth', peak: 0.12 });
    }
    function playDrawSound() {
      if (!soundEnabled) return;
      playTone({ freq: 300, endFreq: 200, duration: 0.35, type: 'sine', peak: 0.15 });
    }

    function vibrate(pattern) {
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    function confettiBurst() {
      const colors = ['#ff0000', '#ffff00', '#2471a3', '#ffffff', '#ff69b4'];
      const container = document.createElement('div');
      container.className = 'confetti-container';
      document.body.appendChild(container);
      for (let i = 0; i < 60; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (2 + Math.random() * 1.5) + 's';
        piece.style.animationDelay = (Math.random() * 0.3) + 's';
        piece.style.transform = `rotate(${Math.random() * 360}deg)`;
        container.appendChild(piece);
      }
      setTimeout(() => container.remove(), 3600);
    }

    // ── Screen helpers ──────────────────────────────────────────────
    function showScreen(screen) {
      [menuScreen, aiMenuScreen, onlineMenuScreen, waitingScreen, gameScreen].forEach(s => s.classList.add('hidden'));
      screen.classList.remove('hidden');
    }

    // ── Build the grid DOM ──────────────────────────────────────────
    function buildGrid() {
      boardEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.classList.add('cell');
          cell.dataset.row = r;
          cell.dataset.col = c;
          boardEl.appendChild(cell);
        }
      }
    }
    buildGrid();

    // ── Drop animation ────────────────────────────────────────────────
    function getCellOffset(r, c) {
      const cell = boardEl.querySelector(`[data-row="${r}"][data-col="${c}"]`);
      const cellRect = cell.getBoundingClientRect();
      const boardRect = boardEl.getBoundingClientRect();
      return {
        left: cellRect.left - boardRect.left,
        top: cellRect.top - boardRect.top,
        size: cellRect.width,
      };
    }

    function animateDrop(row, col, color) {
      return new Promise(resolve => {
        const target = getCellOffset(row, col);
        const top0 = getCellOffset(0, col);

        // Board isn't laid out (e.g. not visible yet) — skip the animation
        // rather than risk feeding invalid/zero-size values into disc.animate().
        if (!(target.size > 0)) { resolve(); return; }

        const startTop = top0.top - (target.size + 6);

        const disc = document.createElement('div');
        disc.className = 'falling-disc ' + color;
        disc.style.width = target.size + 'px';
        disc.style.height = target.size + 'px';
        disc.style.left = target.left + 'px';
        disc.style.top = startTop + 'px';
        boardEl.appendChild(disc);

        const distance = target.top - startTop;
        const bounce = Math.max(4, target.size * 0.15);

        try {
          const anim = disc.animate([
            { transform: 'translateY(0px)', offset: 0 },
            { transform: `translateY(${distance}px)`, offset: 0.65 },
            { transform: `translateY(${distance - bounce}px)`, offset: 0.8 },
            { transform: `translateY(${distance}px)`, offset: 0.92 },
            { transform: `translateY(${distance - bounce * 0.4}px)`, offset: 0.96 },
            { transform: `translateY(${distance}px)`, offset: 1 },
          ], { duration: 480, easing: 'ease-out', fill: 'forwards' });

          anim.onfinish = () => {
            disc.remove();
            try { playDropSound(); vibrate(20); } catch (e) { console.error(e); }
            resolve();
          };
        } catch (e) {
          console.error(e);
          disc.remove();
          resolve();
        }
      });
    }

    // ── Render board state from server ──────────────────────────────
    function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

    async function renderState(state) {
      const instant = !previousBoard || animating;

      // Prefer the server's explicit move list (correctly ordered, even when
      // 2 AI opponents move in one response) — fall back to diffing the
      // board against what we last rendered (used for online polling, which
      // has no "moves" to report since it just reads current state).
      const usingMoves = !instant && state.moves && state.moves.length > 0;
      const newCells = usingMoves ? state.moves.map(m => ({ r: m.row, c: m.col, color: m.color })) : [];
      const newCellSet = new Set(newCells.map(nc => `${nc.r},${nc.c}`));

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = boardEl.querySelector(`[data-row="${r}"][data-col="${c}"]`);
          cell.classList.remove('red', 'yellow', 'blue', 'win');
          cell.style.background = '';
          const val = state.board[r][c];
          const prevVal = previousBoard ? previousBoard[r][c] : null;
          if (usingMoves && newCellSet.has(`${r},${c}`)) {
            continue; // already queued via state.moves
          }
          if (val && !usingMoves && !instant && !prevVal) {
            newCells.push({ r, c, color: val });
          } else if (val) {
            cell.classList.add(val);
          }
        }
      }

      if (newCells.length) {
        animating = true;
        for (const nc of newCells) {
          await animateDrop(nc.r, nc.c, nc.color);
          boardEl.querySelector(`[data-row="${nc.r}"][data-col="${nc.c}"]`).classList.add(nc.color);
        }
        animating = false;
      }

      previousBoard = state.board.map(row => row.slice());

      if (state.winCells && state.winCells.length) {
        state.winCells.forEach(([r, c]) => {
          boardEl.querySelector(`[data-row="${r}"][data-col="${c}"]`).classList.add('win');
        });
      }

      statusEl.className = '';
      try {
        if (state.winner === myColor) {
          statusEl.textContent = 'You win! 🎉';
          statusEl.className = 'player-' + state.winner;
          if (!instant) { playWinSound(); vibrate([40, 60, 40, 60, 120]); confettiBurst(); }
        } else if (state.winner) {
          statusEl.textContent = `${cap(state.winner)} wins!`;
          statusEl.className = 'player-' + state.winner;
          if (!instant) { playLoseSound(); vibrate(80); }
        } else if (state.draw) {
          statusEl.textContent = "It's a draw!";
          statusEl.className = 'draw';
          if (!instant) playDrawSound();
        } else {
          statusEl.textContent = '';
        }
      } catch (e) { console.error(e); }

      if (state.gameOver) {
        turnText.textContent = '';
        discPrev.style.background = 'transparent';
      } else if (mode === 'online' && !state.allJoined) {
        const need = state.seatsTotal - state.seatsTaken;
        turnText.textContent = `Waiting for ${need} more player${need === 1 ? '' : 's'}...`;
        discPrev.style.background = 'transparent';
      } else if (state.currentPlayer === myColor) {
        turnText.textContent = 'Your turn';
        discPrev.style.background = COLOR_HEX[myColor];
      } else {
        turnText.textContent = `${cap(state.currentPlayer)}'s turn...`;
        discPrev.style.background = COLOR_HEX[state.currentPlayer];
      }
    }

    // ── AI-mode fetch helpers ────────────────────────────────────────
    async function fetchAiState() {
      const res = await fetch('/state');
      return res.json();
    }
    async function sendAiMove(col) {
      const res = await fetch('/move', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ col })
      });
      return res.json();
    }
    async function sendAiReset(players) {
      const res = await fetch('/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ players })
      });
      return res.json();
    }

    // ── Online-mode fetch helpers ────────────────────────────────────
    async function createRoom(players) {
      const res = await fetch('/api/rooms', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ players })
      });
      return res.json();
    }
    async function joinRoom(roomId) {
      const res = await fetch(`/api/rooms/${roomId}/join`, { method: 'POST' });
      return res.json();
    }
    async function fetchRoomState() {
      const res = await fetch(`/api/rooms/${online.roomId}/state?token=${online.playerToken}`);
      return res.json();
    }
    async function sendRoomMove(col) {
      const res = await fetch(`/api/rooms/${online.roomId}/move`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: online.playerToken, col })
      });
      return res.json();
    }
    async function sendRoomReset() {
      const res = await fetch(`/api/rooms/${online.roomId}/reset`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: online.playerToken })
      });
      return res.json();
    }

    // ── Polling for online mode ──────────────────────────────────────
    function stopPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    function startPolling() {
      stopPolling();
      pollTimer = setInterval(async () => {
        if (busy) return;
        const state = await fetchRoomState();
        if (state.error) { stopPolling(); return; }
        await handleRoomState(state);
      }, 1000);
    }

    async function handleRoomState(state) {
      if (!state.allJoined) {
        roomCodeDisplay.textContent = online.roomId;
        const need = state.seatsTotal - state.seatsTaken;
        waitingText.textContent = `Waiting for ${need} more player${need === 1 ? '' : 's'} to join...`;
        showScreen(waitingScreen);
      } else {
        showScreen(gameScreen);
        await renderState(state);
      }
    }

    // ── Persist / restore online session ─────────────────────────────
    // sessionStorage (not localStorage) so two tabs in the same browser
    // each keep their own seat instead of clobbering each other's token.
    function saveOnline() {
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(online));
    }
    function clearOnline() {
      sessionStorage.removeItem(STORAGE_KEY);
      online = null;
      stopPolling();
    }
    async function tryRestoreOnline() {
      const raw = sessionStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      try {
        online = JSON.parse(raw);
      } catch (e) {
        sessionStorage.removeItem(STORAGE_KEY);
        return false;
      }
      mode = 'online';
      myColor = online.color;
      const state = await fetchRoomState();
      if (state.error) {
        clearOnline();
        return false;
      }
      await handleRoomState(state);
      startPolling();
      return true;
    }

    // ── Click a column ──────────────────────────────────────────────
    boardEl.addEventListener('click', async e => {
      if (busy) return;
      const cell = e.target.closest('.cell');
      if (!cell) return;
      const col = +cell.dataset.col;

      if (mode === 'ai') {
        busy = true;
        turnText.textContent = 'Computer thinking...';
        discPrev.style.background = '#888';
        try {
          const state = await sendAiMove(col);
          if (!state.error) await renderState(state);
        } finally {
          busy = false;
        }
      } else if (mode === 'online') {
        busy = true;
        try {
          const state = await sendRoomMove(col);
          if (!state.error) await renderState(state);
        } finally {
          busy = false;
        }
      }
    });

    // ── Column hover ────────────────────────────────────────────────
    boardEl.addEventListener('mouseover', e => {
      if (busy) return;
      const cell = e.target.closest('.cell');
      if (!cell) return;
      const col = +cell.dataset.col;
      boardEl.querySelectorAll(`[data-col="${col}"]`).forEach(c => {
        if (!c.classList.contains('red') && !c.classList.contains('yellow') && !c.classList.contains('blue'))
          c.style.background = '#2c3e50';
      });
    });

    boardEl.addEventListener('mouseout', e => {
      const cell = e.target.closest('.cell');
      if (!cell) return;
      const col = +cell.dataset.col;
      boardEl.querySelectorAll(`[data-col="${col}"]`).forEach(c => {
        c.style.background = '';
      });
    });

    // ── Reset / rematch ───────────────────────────────────────────────
    resetBtn.addEventListener('click', async () => {
      busy = true;
      try {
        if (mode === 'ai') {
          const state = await sendAiReset(aiPlayerCount);
          await renderState(state);
        } else if (mode === 'online') {
          const state = await sendRoomReset();
          if (!state.error) await renderState(state);
        }
      } finally {
        busy = false;
      }
    });

    // ── Navigation ─────────────────────────────────────────────────────
    let aiPlayerCount = 2;

    async function startAiGame(players) {
      clearOnline();
      mode = 'ai';
      myColor = 'red';
      aiPlayerCount = players;
      previousBoard = null;
      showScreen(gameScreen);
      const state = await sendAiReset(players);
      await renderState(state);
    }

    playAiBtn.addEventListener('click', () => showScreen(aiMenuScreen));
    aiMenuBackBtn.addEventListener('click', () => showScreen(menuScreen));
    ai2pBtn.addEventListener('click', () => startAiGame(2));
    ai3pBtn.addEventListener('click', () => startAiGame(3));

    playOnlineBtn.addEventListener('click', () => {
      onlineErrorEl.textContent = '';
      joinCodeInput.value = '';
      showScreen(onlineMenuScreen);
    });

    onlineBackBtn.addEventListener('click', () => showScreen(menuScreen));

    function selectOnlineSize(players) {
      onlinePlayers = players;
      online2pBtn.classList.toggle('selected', players === 2);
      online3pBtn.classList.toggle('selected', players === 3);
    }
    online2pBtn.addEventListener('click', () => selectOnlineSize(2));
    online3pBtn.addEventListener('click', () => selectOnlineSize(3));

    createRoomBtn.addEventListener('click', async () => {
      const res = await createRoom(onlinePlayers);
      if (res.error) { onlineErrorEl.textContent = res.error; return; }
      mode = 'online';
      previousBoard = null;
      online = { roomId: res.roomId, playerToken: res.playerToken, color: res.color };
      myColor = online.color;
      saveOnline();
      roomCodeDisplay.textContent = online.roomId;
      showScreen(waitingScreen);
      startPolling();
    });

    joinRoomBtn.addEventListener('click', async () => {
      const code = joinCodeInput.value.trim().toUpperCase();
      if (!code) return;
      const res = await joinRoom(code);
      if (res.error) { onlineErrorEl.textContent = res.error; return; }
      mode = 'online';
      previousBoard = null;
      online = { roomId: res.roomId, playerToken: res.playerToken, color: res.color };
      myColor = online.color;
      saveOnline();
      const state = await fetchRoomState();
      await handleRoomState(state);
      startPolling();
    });

    waitingBackBtn.addEventListener('click', () => {
      clearOnline();
      mode = null;
      showScreen(menuScreen);
    });

    leaveBtn.addEventListener('click', () => {
      clearOnline();
      mode = null;
      showScreen(menuScreen);
    });

    // ── Recover from a stuck animation ──────────────────────────────────
    // Backgrounded tabs can throttle/pause Web Animations indefinitely, so
    // anim.onfinish may never fire while hidden — leaving busy/animating
    // stuck. If that happens, clean up and resync once the tab is visible.
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState !== 'visible') return;
      const stuck = animating || document.querySelector('.falling-disc');
      if (!stuck || gameScreen.classList.contains('hidden')) return;
      document.querySelectorAll('.falling-disc').forEach(d => d.remove());
      animating = false;
      busy = false;
      previousBoard = null; // force an instant resync, skip re-animating
      if (mode === 'ai') {
        await renderState(await fetchAiState());
      } else if (mode === 'online' && online) {
        const state = await fetchRoomState();
        if (!state.error) await handleRoomState(state);
      }
    });

    // ── Init ────────────────────────────────────────────────────────
    async function init() {
      const restored = await tryRestoreOnline();
      if (!restored) showScreen(menuScreen);
    }

    init();
  </script>
</body>
</html>
